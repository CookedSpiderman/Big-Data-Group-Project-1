# Logstash pipeline: Kafka topic2 -> Elasticsearch index "entity-counts".
# Runs inside Docker, so it reaches Kafka at kafka:29092 (the internal listener).
input {
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["topic2"]
    codec => "json"
    group_id => "logstash-entity-counts"
    auto_offset_reset => "earliest"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "entity-counts"
    # One document per entity: a new running total REPLACES the old one
    # instead of being added on top of it.
    document_id => "%{entity}"
  }
}
